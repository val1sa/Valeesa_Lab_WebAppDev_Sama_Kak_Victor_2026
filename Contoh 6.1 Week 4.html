<html lang="en">
<head>
    <div class="kartu">
      <h2 id="judul-kartu">Judul Kartu</h2>
      <p class="deskripsi">Ini adalah deskripsi awal dari kartu.</p>
      <button id="btn-ubah">Ubah Konten</button>
    </div>
    <style>
        font-family: system-ui, sans-serif;
        padding: 20px;
      }
      .kartu {
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 20px;
        max-width: 320px;
      }
      button {
        margin-top: 10px;
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
    <script>
        const btn = document.getElementById("btn-ubah");
      const judul = document.querySelector("#judul-kartu");
      const deskripsi = document.querySelector(".deskripsi");
      btn.addEventListener("click", () => {
        judul.textContent = "Judul Sudah Diubah!";
        deskripsi.textContent =
          "Konten ini diganti oleh JavaScript saat tombol diklik.";
      });
    </script>
</body>
</html>
